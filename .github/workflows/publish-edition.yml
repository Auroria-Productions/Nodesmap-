name: Publish MilzzyNodesMap edition release

on:
  push:
    branches:
      - main
      - square-map
    paths:
      - .github/workflows/publish-edition.yml
      - release-inputs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodesmap-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Verify exact edition assets
        id: edition
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main)
              tag="v0.3.8-standard"
              label="MilzzyNodesMap Standard v0.3.8"
              jar="release-inputs/MilzzyNodesMap-0.3.8-Standard.jar"
              source="release-inputs/MilzzyNodesMap-0.3.8-Standard-Source.zip"
              expected="0.3.8"
              ;;
            square-map)
              tag="v0.3.9-square"
              label="MilzzyNodesMap Square Edition v0.3.9"
              jar="release-inputs/MilzzyNodesMap-0.3.9-Square.jar"
              source="release-inputs/MilzzyNodesMap-0.3.9-Square-Source.zip"
              expected="0.3.9-square"
              ;;
            *) echo "::error::Unsupported branch"; exit 1 ;;
          esac

          if [[ ! -s "$jar" || ! -s "$source" ]]; then
            echo "::notice::Release not published: upload BOTH edition inputs to release-inputs/ on $GITHUB_REF_NAME"
            echo "::notice::Expected $jar and $source"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip -t "$jar" | tail -1
          unzip -t "$source" | tail -1
          unzip -p "$jar" plugin.yml | grep -F "name: milzzynodesmap"
          unzip -p "$jar" plugin.yml | grep -F "version: $expected"
          if ! unzip -Z1 "$source" | grep -q 'milzzynodesmap/src/phonon/nodesmap/compat/NodesLink.java'; then
            echo "::error::Source archive missing NodesLink.java"; exit 1
          fi
          if ! unzip -Z1 "$source" | grep -q 'milzzynodesmap/rebuild.sh'; then
            echo "::error::Source archive missing rebuild.sh"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Import readable edition source into branch
        if: steps.edition.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE: ${{ steps.edition.outputs.source }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          unzip -q "$SOURCE" -d "$staging"
          src="$(find "$staging" -type d -name milzzynodesmap -print -quit)"
          if [[ -z "$src" ]]; then echo "::error::Missing milzzynodesmap source directory"; exit 1; fi
          mkdir -p milzzynodesmap
          for folder in src web tools checks examples; do
            if [[ -d "$src/$folder" ]]; then
              mkdir -p "milzzynodesmap/$folder"
              cp -R "$src/$folder/." "milzzynodesmap/$folder/"
            fi
          done
          for file in README.md WAR-VIEWER-CHANGELOG.md rebuild.sh; do
            if [[ -f "$src/$file" ]]; then cp "$src/$file" "milzzynodesmap/$file"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milzzynodesmap/
          if ! git diff --cached --quiet; then
            git commit -m "Import verified $GITHUB_REF_NAME map source"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "Readable source imported; vendored binary dependencies remain in source ZIP"

      - name: Publish matching JAR and source ZIP
        if: steps.edition.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.edition.outputs.tag }}
          LABEL: ${{ steps.edition.outputs.label }}
          JAR: ${{ steps.edition.outputs.jar }}
          SOURCE: ${{ steps.edition.outputs.source }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$LABEL" --notes "Download the matching JAR and source ZIP below. Install one map edition at a time. Requires a compatible MilzzyNodes core, Paper 1.21.x and Java 21. Back up your map data before replacing the map JAR. The source is a patch-build distribution and includes the historical upstream compiled base used to reproduce this edition."
          fi
          gh release upload "$TAG" "$JAR" "$SOURCE" --clobber
          gh release view "$TAG" --json tagName,assets --jq '{tag:.tagName,assets:[.assets[].name]}'
          echo "Published $TAG with validated JAR and source archives"
